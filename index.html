---
layout: default
---

<section class="home-intro" aria-label="About me">
  <p>
    <a class="shiny-name" href="{{ '/about' | prepend: site.baseurl }}"><span class="shiny-name-sparkle" aria-hidden="true">✦</span> Putu Yoga</a>
    — Personal Thoughts.
  </p>
</section>

<div class="home-divider" aria-hidden="true"></div>

<section class="post-list home-post-list">
  <ul>
    {% for post in site.posts limit: 8 %}

    <li>
      <div class="title">
        <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
      </div>

      <div class="post-date">
        <span>{{ post.date | date: "%d/%m" }}</span>
      </div>
    </li>

    {% endfor %}
  </ul>

  <p class="more-posts">
    <a href="{{ '/posts/' | prepend: site.baseurl }}">More ›</a>
  </p>
</section>
