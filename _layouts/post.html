---
layout: default
---

<noscript>
  <style>
    article .footnotes {
      display: block;
    }
  </style>
</noscript>

<article>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time>{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>

  <div class="divider"></div>

  {{ content }} {% include comments.html %}
</article>

<div class="back">
  <a href="{{site.baseurl}}/">Back to home</a>
</div>
